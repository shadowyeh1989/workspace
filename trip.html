html,body{margin:0;height:100%}

.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--red);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center}

.wrap{padding:0 14px;max-width:760px;margin:0 auto}

.det p{margin:0 0 10px}
.meta{color:var(--mute);font-size:14px;margin-bottom:8px}
.btns{display:flex;flex-wrap:wrap;gap:8px}

.btn.pri{background:var(--red);border-color:var(--red);color:#fff;font-weight:700}
.btn[disabled]{opacity:.4;cursor:default}
.gm{margin-top:12px;border-radius:12px;overflow:hidden;aspect-ratio:4/3;background:var(--seaBg)}
.gm iframe{width:100%;height:100%;border:0}
.legnext{margin-top:12px;padding:10px 12px;border-radius:12px;background:var(--seaBg);font-size:14px}
.pay{font-style:normal;display:inline-block;font-size:12px;font-weight:700;line-height:1;padding:4px 7px;border-radius:6px;margin-right:6px;vertical-align:2px;white-space:nowrap;color:#fff}

.tl{list-style:none;margin:0;padding:0}
.row{display:grid;grid-template-columns:46px minmax(0,1fr);gap:10px;padding:7px 6px;border-radius:10px}
.row .t{font-size:13px;font-weight:700;text-align:right;white-space:nowrap;padding-top:2px}

.row.s{cursor:pointer}.row.s:hover,.row.s[aria-current=true]{background:var(--seaBg)}

footer{color:var(--mute);font-size:13px;margin-top:16px}

/* ===== 資料到這裡 ===== */
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const payc=p=>p.startsWith('周遊')?'jr':p.startsWith('Suica')?'ic':p.startsWith('現金')?'cash':'taxi';
const chip=p=>p?`<i class="pay ${payc(p)}">${esc(p)}</i>`:'';
const gq=q=>'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(q);
const map=L.map('map',{zoomControl:false,attributionControl:true}).setView([34.6,133.3],8);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'}).addTo(map);
L.control.zoom({position:'bottomright'}).addTo(map);
const layer=L.layerGroup().addTo(map);
let day=DAYS[0],sel=0,markers={},gmOpen=false;
const stops=()=>day.items.map((x,i)=>x.k==='s'?i:-1).filter(i=>i>=0);
const short=n=>n.replace(/^(午餐|晚餐|下午茶)：/,'');
function drawMap(){
  layer.clearLayers();markers={};
  const S=stops(),pts=S.map(i=>day.items[i].c);
  L.polyline(pts,{color:'#e0442a',weight:4,opacity:.9}).addTo(layer);
  S.forEach((i,n)=>{const x=day.items[i];
    const m=L.marker(x.c,{icon:L.divIcon({className:'',html:`<div class="pin" id="p${i}"><b>${n+1}</b></div>`,iconSize:[30,30],iconAnchor:[15,30]})})
      .bindTooltip(esc(short(x.n)),{permanent:true,direction:'top',offset:[0,-30],className:'lbl l'+i})
      .on('click',()=>pick(i,true,false)).addTo(layer);
    markers[i]=m});
  map.fitBounds(L.latLngBounds(pts),{padding:[40,40],maxZoom:15});
  document.querySelectorAll('.lbl').forEach(el=>el.style.display=el.classList.contains('l'+sel)?'':'none');
}
function render(){
  $('tabs').innerHTML=DAYS.map(d=>`<button class="tab" data-d="${d.id}" aria-selected="${d===day}"><b>${d.date}</b><span>${d.dow}</span></button>`).join('');
  $('dt').textContent=`${day.date}（${day.dow}）${day.title}`;$('lead').textContent=day.lead;
  const S=stops();let html='',n=0;
  day.items.forEach((x,i)=>{
    if(x.k==='s'){html+=`<button class="c" data-i="${i}" aria-current="${i===sel}"><span class="n">${++n}</span><small>${x.t}</small><b>${esc(short(x.n))}</b></button>`}
    else if(n>0&&n<S.length){html+=`<div class="gap">${x.d?esc(x.d):''}</div>`}
  });
  $('cards').innerHTML=html;
  n=0;
  $('tl').innerHTML=day.items.map((x,i)=>x.k==='s'
    ?`<li class="row s" tabindex="0" data-i="${i}" aria-current="${i===sel}"><span class="t">${x.t}</span><span><b>${++n}. ${esc(x.n)}</b><span>${x.st?'停留 '+esc(x.st):''}${x.st&&x.note?' · ':''}${esc(x.note)}</span></span></li>`
    :`<li class="row m"><span class="t">${x.t}</span><span><b>${chip(x.p)}${esc(x.n)}${x.d?'（'+esc(x.d)+'）':''}</b>${x.note?`<span>${esc(x.note)}</span>`:''}</span></li>`).join('');
  det();
  document.querySelectorAll('.pin').forEach(p=>p.classList.toggle('on',p.id==='p'+sel));
  document.querySelectorAll('.lbl').forEach(el=>el.style.display=el.classList.contains('l'+sel)?'':'none');
  const cur=$('cards').querySelector('[aria-current=true]');
  if(cur)$('cards').scrollTo({left:cur.offsetLeft-$('cards').clientWidth/2+75,behavior:'smooth'});
}
function det(){
  const S=stops(),k=S.indexOf(sel),x=day.items[sel];
  let leg=[];for(let j=sel+1;j<day.items.length&&day.items[j].k==='m';j++)leg.push(day.items[j]);
  $('det').innerHTML=`<div class="when">第 ${k+1} 站 · ${x.t}</div><h2>${esc(x.n)}</h2>
  ${x.st?`<div class="meta">停留 ${esc(x.st)}</div>`:''}${x.note?`<p>${esc(x.note)}</p>`:''}
  <div class="btns"><button class="btn" data-go="-1" ${k<=0?'disabled':''}>上一站</button><button class="btn" data-go="1" ${k>=S.length-1?'disabled':''}>下一站</button>
  <button class="btn" data-gm>${gmOpen?'收起 Google 地圖':'Google 評分'}</button><a class="btn pri" href="${gq(x.q)}" target="_blank" rel="noopener">開 Google 地圖</a></div>
  ${gmOpen?`<div class="gm"><iframe loading="lazy" title="Google 地圖" src="https://maps.google.com/maps?q=${encodeURIComponent(x.q)}&hl=zh-TW&z=16&output=embed"></iframe></div>`:''}
  ${leg.length?`<div class="legnext"><b>接下來：</b>${leg.map(m=>chip(m.p)+esc(m.n)+(m.d?'（'+esc(m.d)+'）':'')).join(' → ')}</div>`:''}`;
}
function pick(i,fly,scroll){sel=i;render();const x=day.items[i];if(fly)map.flyTo(x.c,Math.max(map.getZoom(),15),{duration:.6});if(scroll)$('det').scrollIntoView({behavior:'smooth',block:'nearest'})}
function setDay(id){day=DAYS.find(d=>d.id===id)||DAYS[0];sel=stops()[0];gmOpen=false;render();drawMap()}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-d],[data-i],[data-go],[data-gm]');if(!t)return;
  if(t.dataset.d!==undefined){location.hash=t.dataset.d;return}
  if(t.dataset.gm!==undefined){gmOpen=!gmOpen;det();return}
  if(t.dataset.go){const S=stops(),k=S.indexOf(sel)+ +t.dataset.go;if(S[k]!=null)pick(S[k],true,false);return}
  if(t.dataset.i!==undefined)pick(+t.dataset.i,true,t.classList.contains('row'));
});
document.addEventListener('keydown',e=>{const r=e.target.closest('.row.s');if(r&&(e.key==='Enter'||e.key===' ')){e.preventDefault();pick(+r.dataset.i,true,true)}});
addEventListener('hashchange',()=>setDay(location.hash.slice(1)));
setDay(location.hash.slice(1));
}
</script>
