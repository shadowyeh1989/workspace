<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<title>拍攝需求確認</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --bg:#0e0e10;--surface:#18181b;--surface-2:#232327;
  --ink:#ededee;--muted:#a1a1a6;--faint:#6e6e73;
  --accent:#d4a05c;--accent-soft:rgba(212,160,92,0.15);--border:#2e2e33;
  --danger:#c87f7f;--success:#6a9c6a;
  --serif:'Iowan Old Style','Charter',Georgia,serif;
  --sans:'Noto Sans TC',-apple-system,BlinkMacSystemFont,sans-serif;
  --mono:ui-monospace,'SF Mono',Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}

.wrap{max-width:560px;margin:0 auto;padding:32px 20px 80px}
.brand-tag{font-size:10px;letter-spacing:.2em;color:var(--faint);text-transform:uppercase;margin-bottom:6px}
h1{font-size:24px;font-weight:600;margin-bottom:2px}
h1 em{font-family:var(--serif);font-style:italic;color:var(--accent);font-weight:500}
.client-line{font-size:14px;color:var(--muted);margin-bottom:28px}
.client-line strong{color:var(--accent)}

.q-block{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:14px}
.q-title{font-size:15px;font-weight:500;color:var(--ink);margin-bottom:12px;line-height:1.5}
.q-title .req{color:var(--danger);margin-left:3px}
.q-title .num{font-family:var(--mono);font-size:12px;color:var(--faint);margin-right:8px}
textarea.q-input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--ink);padding:12px 14px;border-radius:9px;font-size:15px;min-height:76px;resize:vertical;line-height:1.5}
textarea.q-input:focus{outline:none;border-color:var(--accent)}
textarea.q-input::placeholder{color:var(--faint);font-size:13.5px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--surface-2);border:1.5px solid var(--border);border-radius:10px;margin-bottom:8px;cursor:pointer;transition:all .13s;font-size:15px}
.opt:last-child{margin-bottom:0}
.opt:hover{border-color:var(--faint)}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--ink)}
.opt .radio{width:19px;height:19px;border-radius:50%;border:2px solid var(--faint);flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:all .13s}
.opt.sel .radio{border-color:var(--accent)}
.opt.sel .radio::after{content:'';width:9px;height:9px;border-radius:50%;background:var(--accent)}
.q-err{font-size:12px;color:var(--danger);margin-top:8px;display:none}
.q-block.has-err{border-color:var(--danger)}
.q-block.has-err .q-err{display:block}

.submit-btn{width:100%;background:var(--accent);color:#fff;border:none;padding:15px;border-radius:12px;font-size:16px;font-weight:600;margin-top:8px;transition:filter .13s}
.submit-btn:hover{filter:brightness(1.08)}
.submit-btn:disabled{opacity:.5;cursor:wait}

.state-msg{padding:70px 20px;text-align:center}
.state-msg .icon{font-size:44px;margin-bottom:14px}
.state-msg .big{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink);margin-bottom:8px}
.state-msg .sub{font-size:13.5px;color:var(--muted);line-height:1.7}
.again-btn{margin-top:22px;background:transparent;border:1px solid var(--border);color:var(--muted);padding:10px 22px;border-radius:9px;font-size:13.5px}
.again-btn:hover{color:var(--accent);border-color:var(--accent)}
.loader{width:30px;height:30px;border:3px solid var(--surface-2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 16px}
@keyframes spin{to{transform:rotate(360deg)}}
.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <!-- LOADING -->
  <div class="state-msg" id="st-loading">
    <div class="loader"></div>
    <div class="big">載入中…</div>
  </div>

  <!-- ERROR -->
  <div class="state-msg hidden" id="st-error">
    <div class="icon">🚫</div>
    <div class="big">無法開啟表單</div>
    <div class="sub" id="st-error-msg"></div>
  </div>

  <!-- FORM -->
  <div id="st-form" class="hidden">
    <div class="brand-tag">Shoot Brief</div>
    <h1 id="f-title">拍攝需求<em>確認</em></h1>
    <div class="client-line">致:<strong id="f-client"></strong>,請協助確認以下拍攝細節,感謝!</div>
    <div id="q-container"></div>
    <button class="submit-btn" id="submit-btn" onclick="submitForm()">送出</button>
  </div>

  <!-- DONE -->
  <div class="state-msg hidden" id="st-done">
    <div class="icon">✅</div>
    <div class="big">已送出,感謝您!</div>
    <div class="sub">您的回覆已成功送達。<br>如需修改,可以再填一次,兩次紀錄都會保留。</div>
    <button class="again-btn" onclick="fillAgain()">再填一次</button>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://bokmluubqcnezjcboogq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJva21sdXVicWNuZXpqY2Jvb2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDI2ODIsImV4cCI6MjA5NTk3ODY4Mn0.W-cvOomywSU2L8xJaX98052_UZqed7rIkALQ_ETxxTw';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {auth:{persistSession:false}});

const $ = id => document.getElementById(id);
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

let form = null;
const answers = {};   // qid -> value

function showState(which){
  ['st-loading','st-error','st-form','st-done'].forEach(id => {
    $(id).classList.toggle('hidden', id !== which);
  });
}

(async function(){
  const params = new URLSearchParams(window.location.search);
  const id = params.get('id');
  if(!id){
    $('st-error-msg').textContent = '連結不完整,請跟提供連結的人確認。';
    showState('st-error');
    return;
  }
  try{
    const {data, error} = await sb.from('shoot_forms')
      .select('id,client_name,title,questions,notify_email,is_active')
      .eq('id', id)
      .maybeSingle();
    if(error) throw error;
    if(!data){
      $('st-error-msg').textContent = '找不到這個表單,可能已被移除。';
      showState('st-error');
      return;
    }
    if(!data.is_active){
      $('st-error-msg').textContent = '這個表單已停用,請跟提供連結的人確認。';
      showState('st-error');
      return;
    }
    form = data;
    renderForm();
    showState('st-form');
  }catch(err){
    console.error(err);
    $('st-error-msg').textContent = '載入失敗:' + err.message;
    showState('st-error');
  }
})();

function renderForm(){
  document.title = (form.title || '拍攝需求確認') + ' · ' + form.client_name;
  $('f-client').textContent = form.client_name;
  if(form.title && form.title !== '拍攝需求確認'){
    $('f-title').innerHTML = esc(form.title);
  }
  const box = $('q-container');
  box.innerHTML = form.questions.map((q, i) => {
    const req = q.required ? '<span class="req">*</span>' : '';
    if(q.type === 'choice'){
      return `<div class="q-block" id="qb-${q.id}">
        <div class="q-title"><span class="num">${i+1}</span>${esc(q.text)}${req}</div>
        ${q.options.map((o,j) => `
          <div class="opt" id="opt-${q.id}-${j}" onclick="pickOption('${q.id}', ${j})">
            <span class="radio"></span>
            <span>${esc(o)}</span>
          </div>
        `).join('')}
        <div class="q-err">請選擇一個選項</div>
      </div>`;
    }
    return `<div class="q-block" id="qb-${q.id}">
      <div class="q-title"><span class="num">${i+1}</span>${esc(q.text)}${req}</div>
      <textarea class="q-input" id="ta-${q.id}" placeholder="${esc(q.placeholder||'請輸入…')}" oninput="answers['${q.id}']=this.value;clearErr('${q.id}')"></textarea>
      <div class="q-err">此題必填</div>
    </div>`;
  }).join('');
}

function pickOption(qid, j){
  const q = form.questions.find(x => x.id === qid);
  if(!q) return;
  answers[qid] = q.options[j];
  q.options.forEach((_, k) => {
    const el = $(`opt-${qid}-${k}`);
    if(el) el.classList.toggle('sel', k === j);
  });
  clearErr(qid);
}
function clearErr(qid){
  const b = $(`qb-${qid}`);
  if(b) b.classList.remove('has-err');
}

async function submitForm(){
  // Validate required
  let firstErr = null;
  for(const q of form.questions){
    const val = (answers[q.id]||'').trim();
    if(q.required && !val){
      $(`qb-${q.id}`).classList.add('has-err');
      if(!firstErr) firstErr = $(`qb-${q.id}`);
    }
  }
  if(firstErr){
    firstErr.scrollIntoView({behavior:'smooth', block:'center'});
    return;
  }
  const btn = $('submit-btn');
  btn.disabled = true;
  btn.textContent = '送出中…';
  // Build clean answers (only answered questions, trimmed)
  const clean = {};
  form.questions.forEach(q => {
    const v = (answers[q.id]||'').trim();
    if(v) clean[q.id] = v;
  });
  try{
    const {error} = await sb.from('shoot_form_responses').insert({
      form_id: form.id,
      answers: clean
    });
    if(error) throw error;
    // Fire email notification (best-effort, doesn't block success)
    notifyByEmail(clean);
    showState('st-done');
    window.scrollTo({top:0});
  }catch(err){
    console.error(err);
    alert('送出失敗:' + err.message + '\n請再試一次,或直接聯繫提供連結的人。');
    btn.disabled = false;
    btn.textContent = '送出';
  }
}

function notifyByEmail(clean){
  if(!form.notify_email) return;
  try{
    // FormSubmit.co AJAX endpoint — first submission triggers an activation email
    // to the notify address; after activating, subsequent submissions are delivered.
    const lines = {};
    form.questions.forEach((q, i) => {
      if(clean[q.id]) lines[`${i+1}. ${q.text}`] = clean[q.id];
    });
    fetch('https://formsubmit.co/ajax/' + encodeURIComponent(form.notify_email), {
      method: 'POST',
      headers: {'Content-Type':'application/json', 'Accept':'application/json'},
      body: JSON.stringify({
        _subject: `📸 拍攝需求回覆:${form.client_name}`,
        表單: form.title || '拍攝需求確認',
        業主: form.client_name,
        ...lines,
        _template: 'table'
      })
    }).catch(()=>{});
  }catch(e){ /* email failure never blocks the submission */ }
}

function fillAgain(){
  Object.keys(answers).forEach(k => delete answers[k]);
  renderForm();
  showState('st-form');
  window.scrollTo({top:0});
}
</script>
</body>
</html>
