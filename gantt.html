<script>
  // Apply saved theme before page renders to prevent flash (shares key with ledger.html / index.html)
  (function() {
    try {
      var saved = localStorage.getItem('shadow_ledger_theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
        return;
      }
    } catch (e) {}
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
  })();
</script>

<style>
*{box-sizing:border-box;margin:0;padding:0}

/* CSS variables for dark/light themes */
:root, [data-theme="dark"] {
  --bg: #0e0e10;
  --surface: #18181b;
  --surface-2: #232327;
  --surface-hover: #2a2a2f;
  --border: #2e2e33;
  --text: #ededee;
  --text-2: #a1a1a6;
  --text-3: #6e6e73;
  --accent: #d4a05c;
  --accent-soft: #6b5234;
  --danger: #c87f7f;
  --danger-bg: #4a2828;
  --success: #6a9c6a;
}
[data-theme="light"] {
  --bg: #faf8f3;
  --surface: #ffffff;
  --surface-2: #f1ede4;
  --surface-hover: #ebe6da;
  --border: #d8d2c4;
  --text: #2a2620;
  --text-2: #5e5849;
  --text-3: #8a8270;
  --accent: #a87434;
  --accent-soft: #ecdcc4;
  --danger: #a04848;
  --danger-bg: #f4dada;
  --success: #4a7a4a;
}
[data-theme="light"] input[type=date]::-webkit-calendar-picker-indicator { filter: none; }

body{background:var(--bg);color:var(--text);font-family:'Noto Sans TC','SF Pro Text',sans-serif;transition:background-color 0.2s ease, color 0.2s ease}
::-webkit-scrollbar{height:6px;width:6px}
::-webkit-scrollbar-track{background:var(--surface-2)}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input[type=date]::-webkit-calendar-picker-indicator{filter:invert(.5)}
@keyframes pulseDot{0%,100%{opacity:0.4}50%{opacity:1}}

/* Auth gate */
.auth-gate{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
.auth-card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:32px 28px;width:100%;max-width:380px;box-shadow:0 12px 32px rgba(0,0,0,0.4)}
.auth-title{font-family:'Iowan Old Style','Charter',Georgia,serif;font-size:22px;margin:0 0 4px;font-weight:400}
.auth-title em{color:var(--accent);font-style:italic}
.auth-sub{font-size:11px;color:var(--text-3);letter-spacing:0.18em;text-transform:uppercase;margin-bottom:22px}
.auth-back{font-size:10px;color:var(--text-3);letter-spacing:0.18em;text-transform:uppercase;text-decoration:none;display:inline-flex;align-items:center;gap:5px;margin-bottom:14px;transition:color 0.15s}
.auth-back:hover{color:var(--accent)}
.auth-field{margin-bottom:14px}
.auth-field label{display:block;font-size:11px;color:var(--text-3);letter-spacing:0.1em;text-transform:uppercase;margin-bottom:6px}
.auth-field input{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);padding:10px 12px;border-radius:7px;font-size:14px;font-family:'Noto Sans TC','SF Pro Text',sans-serif}
.auth-field input:focus{outline:none;border-color:var(--accent)}
.auth-submit{width:100%;background:var(--accent);color:var(--bg);border:none;padding:11px;border-radius:7px;font-size:14px;font-weight:500;cursor:pointer;margin-top:6px;transition:opacity 0.15s}
.auth-submit:hover{opacity:0.85}
.auth-submit:disabled{opacity:0.5;cursor:not-allowed}
.auth-mode-switch{text-align:center;margin-top:14px;font-size:12px;color:var(--text-3)}
.auth-mode-switch a{color:var(--accent);cursor:pointer;text-decoration:none}
.auth-error{background:var(--danger-bg);color:var(--danger);padding:10px 12px;border-radius:6px;font-size:12px;margin-bottom:12px;display:none;border:1px solid var(--danger)}
.auth-error.show{display:block}
.auth-offline{background:var(--surface-2);color:var(--text-3);padding:8px 12px;border-radius:6px;font-size:11px;margin-top:12px;text-align:center;border:1px solid var(--border);cursor:pointer}
.auth-offline:hover{color:var(--text-2)}

/* Migration dialog */
.migration-dialog{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:800;display:flex;align-items:center;justify-content:center;padding:20px}
.migration-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:24px;max-width:440px;width:100%}
.migration-title{font-family:'Iowan Old Style','Charter',Georgia,serif;font-style:italic;font-size:18px;margin:0 0 8px;font-weight:400}
.migration-text{font-size:13px;color:var(--text-2);line-height:1.65;margin-bottom:20px}
.migration-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.migration-btn{padding:8px 14px;font-size:12.5px;background:var(--surface-2);color:var(--text);border:1px solid var(--border);border-radius:7px;cursor:pointer;font-family:inherit}
.migration-btn:hover{background:var(--surface-hover)}
.migration-btn.primary{background:var(--accent);color:var(--bg);border-color:var(--accent)}

/* Workspace back link */
.ws-back{display:inline-flex;align-items:center;gap:5px;font-size:10px;color:var(--text-3);letter-spacing:0.18em;text-transform:uppercase;text-decoration:none;transition:color 0.15s;cursor:pointer}
.ws-back:hover{color:var(--accent)}
.ws-back .arrow{transition:transform 0.15s;display:inline-block}
.ws-back:hover .arrow{transform:translateX(-2px)}

/* Theme toggle button (floating) */
.theme-toggle-btn{background:var(--surface);border:1px solid var(--border);color:var(--text-2);cursor:pointer;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:all 0.15s}
.theme-toggle-btn:hover{color:var(--accent);border-color:var(--accent)}
</style>
</head>
<body>

<!-- Auth gate (login screen) -->
<div class="auth-gate" id="authGate" style="display:none">
  <div class="auth-card">
    <a href="index.html" class="auth-back"><span>←</span><span>Workspace</span></a>
    <h1 class="auth-title">多專案<em>甘特圖</em></h1>
    <div class="auth-sub">PROJECT · TIMELINE · GANTT</div>
    <div class="auth-error" id="authError"></div>
    <form id="authForm">
      <div class="auth-field">
        <label for="authEmail">Email</label>
        <input type="email" id="authEmail" autocomplete="email" required>
      </div>
      <div class="auth-field">
        <label for="authPassword">密碼</label>
        <input type="password" id="authPassword" autocomplete="current-password" required>

      <button type="submit" class="auth-submit" id="authSubmit">登入</button>

    <div class="auth-mode-switch">
      <span id="authModeText">還沒有帳號?</span>
      <a id="authModeSwitch">註冊新帳號</a>

    <div class="auth-offline" id="authOfflineBtn">⏏ 離線使用 (僅本機 · 不同步)</div>
  </div>
</div>

<!-- Migration dialog -->
<div class="migration-dialog" id="migrationDialog" style="display:none">
  <div class="migration-card">
    <h2 class="migration-title">偵測到本機已有資料</h2>
    <div class="migration-text">
      你的瀏覽器中有過去儲存的甘特圖工作區,而雲端帳號目前是空的。<br><br>
      要把本機資料<strong style="color:var(--text)">上傳到雲端</strong>嗎?上傳後其他裝置就能看到。
    </div>
    <div class="migration-actions">
      <button class="migration-btn" id="migrationSkipBtn">略過 · 使用雲端 (空)</button>
      <button class="migration-btn primary" id="migrationUploadBtn">上傳本機資料到雲端</button>
    </div>
  </div>
</div>

<script type="text/babel">
const {useState,useEffect,useRef}=React;
const PC=['#d4a05c','#6a9c6a','#f59e0b','#c87f7f','#8b5cf6','#ec4899','#06b6d4','#f97316'];
const today=new Date();today.setHours(0,0,0,0);
const ds=d=>d.toISOString().slice(0,10);
const ad=(d,n)=>{const r=new Date(d);r.setDate(r.getDate()+n);return r;};
const db=(a,b)=>Math.round((new Date(b)-new Date(a))/86400000);
let nPid=10,nTid=100;

// ============ SUPABASE SYNC LAYER ============
const SUPABASE_URL='https://bokmluubqcnezjcboogq.supabase.co';
const SUPABASE_ANON_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJva21sdXVicWNuZXpqY2Jvb2dxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA0MDI2ODIsImV4cCI6MjA5NTk3ODY4Mn0.W-cvOomywSU2L8xJaX98052_UZqed7rIkALQ_ETxxTw';
const CLOUD_TABLE='gantt_data';
const CLOUD_SYNC_DEBOUNCE_MS=3000;
const OFFLINE_MODE_KEY='shadow_gantt_offline_mode';
const BACKUP_META_KEY='gantt-backup-meta';
const AUTO_BACKUP_DEBOUNCE_MS=8000;

let sbClient=null;
function initSupabase(){
  if(!window.supabase||!window.supabase.createClient)return false;
  if(sbClient)return true;
  sbClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  return true;
}
const supportsFSA=()=>typeof window.showDirectoryPicker==='function';
function getBackupMeta(){
  try{const r=localStorage.getItem(BACKUP_META_KEY);return r?JSON.parse(r):{lastManualBackup:null,lastAutoBackup:null};}
  catch(e){return{lastManualBackup:null,lastAutoBackup:null};}
}
function setBackupMeta(updates){
  const m=getBackupMeta();Object.assign(m,updates);
  try{localStorage.setItem(BACKUP_META_KEY,JSON.stringify(m));}catch(e){}
  return m;
}

function App(){
  const [projs,setProjs]=useState([]);
  const [loaded,setLoaded]=useState(false);
  const [saveSt,setSaveSt]=useState('');
  const [tags,setTags]=useState([]);
  const [vStart,setVStart]=useState(today);
  const [vDays,setVDays]=useState(45);
  const [modal,setModal]=useState(null);
  const [form,setForm]=useState({});
  const [lw,setLw]=useState(210);
  const [dProj,setDProj]=useState(null);
  const [doPrj,setDoPrj]=useState(null);
  const [dTask,setDTask]=useState(null);
  const [doTsk,setDoTsk]=useState(null);
  const [title,setTitle]=useState('我的甘特圖');
  const [editTitle,setEditTitle]=useState(false);
  const [ctxMenu,setCtxMenu]=useState(null);
  const [selected,setSelected]=useState(new Set()); // Set of "projId:taskId"
  const barDragRef=useRef(null); // {startX, cw, origDates:{key:{start,end}}}
  // Workspace
  const [workspaces,setWorkspaces]=useState([]);
  const [wsId,setWsId]=useState(null);
  const [wsMenu,setWsMenu]=useState(false);
  const [wsForm,setWsForm]=useState(null); // null | 'add' | wsId (edit)
  const [wsName,setWsName]=useState('');
  const titleRef=useRef();
  const fileRef=useRef();
  const wsRef=useRef();

  // ===== Cloud sync state =====
  const [currentUser,setCurrentUser]=useState(null);   // {id, email} when logged in
  const [syncStatus,setSyncStatus]=useState('offline'); // synced | syncing | offline | error
  const [offlineMode,setOfflineMode]=useState(false);
  const [cloudLastSavedAt,setCloudLastSavedAt]=useState(null);
  const [bMeta,setBMeta]=useState(getBackupMeta());
  const [bMenuOpen,setBMenuOpen]=useState(false);
  const [userMenuOpen,setUserMenuOpen]=useState(false);
  const cloudSyncTimerRef=useRef(null);
  const cloudSyncInFlightRef=useRef(false);
  const bMenuRef=useRef();
  const userMenuRef=useRef();
  // Auto-backup (file system access API)
  const [autoBkActive,setAutoBkActive]=useState(false);
  const [autoBkFolderName,setAutoBkFolderName]=useState('');
  const autoBkHandleRef=useRef(null);
  const autoBkTimerRef=useRef(null);
  const autoBkInFlightRef=useRef(false);
  const [tick,setTick]=useState(0); // forces re-render every minute

  // Helper: load a workspace into state
  function loadWs(ws){
    setProjs(ws.projs||[]);
    setTags(ws.tags||[]);
    setTitle(ws.title||'我的甘特圖');
    nPid=ws.nPid||10;
    nTid=ws.nTid||100;
  }

  useEffect(()=>{
    try{
      const raw=localStorage.getItem('gantt-workspaces');
      const curId=localStorage.getItem('gantt-ws-current');
      if(raw){
        const wsList=JSON.parse(raw);
        setWorkspaces(wsList);
        const cur=wsList.find(w=>w.id===curId)||wsList[0];
        if(cur){ setWsId(cur.id); loadWs(cur); }
      } else {
        // First time: migrate old data or create default workspace
        const oldRaw=localStorage.getItem('gantt2');
        const oldData=oldRaw?JSON.parse(oldRaw):{};
        const firstWs={id:'ws-1',name:'預設工作區',projs:oldData.projs||[],tags:oldData.tags||[],title:oldData.title||'我的甘特圖',nPid:oldData.nPid||10,nTid:oldData.nTid||100};
        setWorkspaces([firstWs]);
        setWsId('ws-1');
        loadWs(firstWs);
      }
    }catch(e){}
    setLoaded(true);
  },[]);

  // ===== When currentUser is set (after login), pull from cloud =====
  useEffect(()=>{
    if(!currentUser||!loaded)return;
    (async()=>{
      const cloudData=await loadFromCloud();
      if(cloudData&&cloudData.workspaces&&cloudData.workspaces.length>0){
        // Cloud has data — use it, overwrite local
        const wsList=cloudData.workspaces;
        const curId=cloudData.currentWsId;
        try{
          localStorage.setItem('gantt-workspaces',JSON.stringify(wsList));
          if(curId)localStorage.setItem('gantt-ws-current',curId);
        }catch(e){}
        setWorkspaces(wsList);
        const cur=wsList.find(w=>w.id===curId)||wsList[0];
        if(cur){ setWsId(cur.id); loadWs(cur); }
        setSyncStatus('synced');
      } else {
        // Cloud is empty — check if local has meaningful data
        const localRaw=localStorage.getItem('gantt-workspaces');
        const localList=localRaw?JSON.parse(localRaw):[];
        const hasContent=localList.some(w=>(w.projs&&w.projs.length>0));
        if(hasContent){
          // Local has data — ask user via migration dialog
          document.getElementById('migrationDialog').style.display='';
        } else {
          setSyncStatus('synced');
        }
      }
    })();
  },[currentUser,loaded]);

  useEffect(()=>{
    if(!loaded||!wsId)return;
    setSaveSt('saving');
    const t=setTimeout(()=>{
      try{
        setWorkspaces(wsList=>{
          const updated=wsList.map(w=>w.id===wsId?{...w,projs,tags,title,nPid,nTid}:w);
          localStorage.setItem('gantt-workspaces',JSON.stringify(updated));
          localStorage.setItem('gantt-ws-current',wsId);
          // Schedule cloud sync and auto-backup
          scheduleCloudSync();
          scheduleAutoBackup();
          return updated;
        });
        setSaveSt('saved');
        setTimeout(()=>setSaveSt(''),2000);
      }catch(e){setSaveSt('');}
    },700);
    return()=>clearTimeout(t);
  },[projs,tags,title,loaded,wsId,currentUser,offlineMode]);

  // ===== Cloud sync functions =====
  async function loadFromCloud(){
    if(!sbClient||!currentUser)return null;
    setSyncStatus('syncing');
    try{
      const {data,error}=await sbClient
        .from(CLOUD_TABLE)
        .select('data, updated_at')
        .eq('user_id',currentUser.id)
        .maybeSingle();
      if(error)throw error;
      setSyncStatus('synced');
      if(!data)return null;
      setCloudLastSavedAt(data.updated_at);
      return data.data;
    }catch(e){
      console.error('Load from cloud failed',e);
      setSyncStatus('error');
      return null;
    }
  }

  async function saveToCloud(){
    if(!sbClient||!currentUser||offlineMode)return;
    if(cloudSyncInFlightRef.current){
      if(cloudSyncTimerRef.current)clearTimeout(cloudSyncTimerRef.current);
      cloudSyncTimerRef.current=setTimeout(saveToCloud,CLOUD_SYNC_DEBOUNCE_MS);
      return;
    }
    cloudSyncInFlightRef.current=true;
    setSyncStatus('syncing');
    try{
      // Read latest workspaces array from localStorage (most up-to-date)
      const wsListRaw=localStorage.getItem('gantt-workspaces')||'[]';
      const wsList=JSON.parse(wsListRaw);
      const curId=localStorage.getItem('gantt-ws-current');
      const payload={workspaces:wsList,currentWsId:curId};
      const {error}=await sbClient.from(CLOUD_TABLE).upsert({
        user_id:currentUser.id,
        data:payload,
        updated_at:new Date().toISOString()
      },{onConflict:'user_id'});
      if(error)throw error;
      setCloudLastSavedAt(new Date().toISOString());
      setSyncStatus('synced');
    }catch(e){
      console.error('Save to cloud failed',e);
      setSyncStatus('error');
    }finally{
      cloudSyncInFlightRef.current=false;
    }
  }

  function scheduleCloudSync(){
    if(!currentUser||offlineMode)return;
    if(cloudSyncTimerRef.current)clearTimeout(cloudSyncTimerRef.current);
    cloudSyncTimerRef.current=setTimeout(saveToCloud,CLOUD_SYNC_DEBOUNCE_MS);
  }

  // ===== Auto-backup (file system access API) =====
  async function enableAutoBackup(){
    if(!supportsFSA()){alert('此瀏覽器不支援自動備份功能,請改用手動匯出。\n(支援的瀏覽器:Chrome / Edge / Opera)');return;}
    try{
      const dirHandle=await window.showDirectoryPicker({mode:'readwrite',startIn:'documents'});
      const perm=await dirHandle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){
        const req=await dirHandle.requestPermission({mode:'readwrite'});
        if(req!=='granted'){alert('未取得資料夾寫入權限');return;}
      }
      autoBkHandleRef.current=dirHandle;
      setAutoBkActive(true);
      setAutoBkFolderName(dirHandle.name);
      setBMeta(setBackupMeta({autoBackupFolderName:dirHandle.name,autoBackupEnabledAt:Date.now()}));
      setBMenuOpen(false);
      await performAutoBackup();
    }catch(err){if(err.name!=='AbortError')alert('啟用失敗:'+err.message);}
  }

  function disableAutoBackup(){
    autoBkHandleRef.current=null;
    setAutoBkActive(false);
    setAutoBkFolderName('');
    if(autoBkTimerRef.current){clearTimeout(autoBkTimerRef.current);autoBkTimerRef.current=null;}
    setBMeta(setBackupMeta({autoBackupFolderName:null}));
    setBMenuOpen(false);
  }

  function scheduleAutoBackup(){
    if(!autoBkHandleRef.current)return;
    if(autoBkTimerRef.current)clearTimeout(autoBkTimerRef.current);
    autoBkTimerRef.current=setTimeout(performAutoBackup,AUTO_BACKUP_DEBOUNCE_MS);
  }

  async function performAutoBackup(){
    if(!autoBkHandleRef.current||autoBkInFlightRef.current)return;
    autoBkInFlightRef.current=true;
    try{
      const dirHandle=autoBkHandleRef.current;
      const perm=await dirHandle.queryPermission({mode:'readwrite'});
      if(perm!=='granted'){
        const req=await dirHandle.requestPermission({mode:'readwrite'});
        if(req!=='granted'){autoBkHandleRef.current=null;setAutoBkActive(false);setAutoBkFolderName('');alert('資料夾權限失效,自動備份已停用');return;}
      }
      const allData=JSON.parse(localStorage.getItem('gantt-workspaces')||'[]');
      const fileHandle=await dirHandle.getFileHandle('甘特圖_自動備份.json',{create:true});
      const writable=await fileHandle.createWritable();
      await writable.write(JSON.stringify({workspaces:allData,currentWsId:wsId},null,2));
      await writable.close();
      setBMeta(setBackupMeta({lastAutoBackup:Date.now()}));
    }catch(err){console.error('Auto backup failed',err);}
    finally{autoBkInFlightRef.current=false;}
  }

  // Expose setters globally so the auth bootstrap (outside React) can push state in
  useEffect(()=>{
    window.__setCurrentUser=setCurrentUser;
    window.__setOfflineMode=setOfflineMode;
    window.__setSyncStatus=setSyncStatus;
  },[]);
  // Always re-bind saveToCloud since it closes over currentUser/offlineMode
  useEffect(()=>{
    window.__forceSync=saveToCloud;
  });

  // ===== Tick for "X mins ago" text =====
  useEffect(()=>{
    const interval=setInterval(()=>setTick(t=>t+1),60000);
    return()=>clearInterval(interval);
  },[]);

  // ===== Close menus on outside click =====
  useEffect(()=>{
    if(!bMenuOpen)return;
    const handler=e=>{if(bMenuRef.current&&!bMenuRef.current.contains(e.target))setBMenuOpen(false);};
    setTimeout(()=>document.addEventListener('mousedown',handler),0);
    return()=>document.removeEventListener('mousedown',handler);
  },[bMenuOpen]);
  useEffect(()=>{
    if(!userMenuOpen)return;
    const handler=e=>{if(userMenuRef.current&&!userMenuRef.current.contains(e.target))setUserMenuOpen(false);};
    setTimeout(()=>document.addEventListener('mousedown',handler),0);
    return()=>document.removeEventListener('mousedown',handler);

  function importJSON(e){
    const file=e.target.files[0];
    if(!file)return;
    const reader=new FileReader();
    reader.onload=ev=>{
      try{
        const s=JSON.parse(ev.target.result);

        // Format A: Multi-workspace backup (auto-backup file or 'workspaces' container)
        // {workspaces: [...], currentWsId: '...'}
        if(s.workspaces&&Array.isArray(s.workspaces)&&s.workspaces.length>0){
          const totalProjs=s.workspaces.reduce((sum,w)=>sum+(w.projs?w.projs.length:0),0);
          if(!confirm(`偵測到「多工作區」格式備份。\n要匯入 ${s.workspaces.length} 個工作區、共 ${totalProjs} 個專案嗎?\n\n⚠ 這會取代目前的所有工作區資料。`))return;
          try{
            localStorage.setItem('gantt-workspaces',JSON.stringify(s.workspaces));
            const newCurId=s.currentWsId||s.workspaces[0].id;
            localStorage.setItem('gantt-ws-current',newCurId);
          }catch(err){alert('儲存失敗:'+err.message);return;}
          alert(`成功匯入 ${s.workspaces.length} 個工作區,即將重新載入頁面…`);
          setTimeout(()=>window.location.reload(),500);
          return;
        }

        // Format B: Single workspace export
        // {projs: [...], tags: [...], title: '...', nPid: N, nTid: N}
        if(s.projs&&Array.isArray(s.projs)){
          const curWsName=workspaces.find(w=>w.id===wsId)?.name||'目前工作區';
          if(!confirm(`偵測到「單一工作區」格式 (${s.projs.length} 個專案)。\n要匯入到「${curWsName}」嗎?\n\n⚠ 「${curWsName}」目前的內容會被取代,其他工作區不受影響。`))return;
          setProjs(s.projs);
          if(s.nPid)nPid=s.nPid;
          if(s.nTid)nTid=s.nTid;
          if(s.tags)setTags(s.tags||[]);
          if(s.title)setTitle(s.title);
          alert(`成功匯入 ${s.projs.length} 個專案到「${curWsName}」`);
          return;
        }

        // Unknown format
        alert('JSON 格式無法辨識。\n\n預期格式:\n• 多工作區備份: { workspaces: [...] }\n• 單一工作區匯出: { projs: [...], tags: [...] }\n\n實際看到的最上層欄位:\n'+Object.keys(s).join(', '));
      }catch(err){
        alert('JSON 解析失敗:'+err.message);
      }
    };
    reader.readAsText(file);
    e.target.value='';
  }

  // Bar drag to move dates
  function onBarMouseDown(e,pid,task,colW){
    if(e.button!==0)return;
    e.preventDefault(); e.stopPropagation();
    const k=selKey(pid,task.id);
    // Build set of tasks to move
    let keys=new Set(selected);
    if(!keys.has(k)) keys=new Set([k]);
    // Record original dates
    const origDates={};
    projs.forEach(p=>p.tasks.forEach(t=>{
      if(keys.has(selKey(p.id,t.id))) origDates[selKey(p.id,t.id)]={start:t.start,end:t.end};
    }));
    barDragRef.current={startX:e.clientX,colW,origDates,keys,moved:false};
    const onMove=ev=>{
      if(!barDragRef.current)return;
      const dx=ev.clientX-barDragRef.current.startX;
      const days=Math.round(dx/barDragRef.current.colW);
      if(days===0)return;
      barDragRef.current.moved=true;
      setProjs(ps=>ps.map(p=>({...p,tasks:p.tasks.map(t=>{
        const tk=selKey(p.id,t.id);
        if(!barDragRef.current.keys.has(tk))return t;
        const orig=barDragRef.current.origDates[tk];
        return {...t,start:ds(ad(new Date(orig.start),days)),end:ds(ad(new Date(orig.end),days))};
      })})));
    };
    const onUp=ev=>{
      window.removeEventListener('mousemove',onMove);
      window.removeEventListener('mouseup',onUp);
      if(!barDragRef.current?.moved){
        // treat as click → open edit only if single task not shift
        if(!e.shiftKey && barDragRef.current?.keys.size===1) oET(pid,task);
      }
      barDragRef.current=null;
    };
    window.addEventListener('mousemove',onMove);
    window.addEventListener('mouseup',onUp);
  }

                <div style={{padding:'8px 10px 6px',fontSize:10,color:'var(--text-3)',letterSpacing:'0.18em',textTransform:'uppercase'}}>備份狀態</div>
                <div style={{padding:'6px 10px 10px',fontSize:11,color:'var(--text-2)',lineHeight:1.6}}>
                  上次手動匯出:<span style={{color:'var(--text)',fontFamily:'ui-monospace,monospace'}}>{bMeta.lastManualBackup?new Date(bMeta.lastManualBackup).toLocaleString('zh-TW',{hour12:false}):'從未'}</span><br/>
                  上次自動備份:<span style={{color:autoBkActive?'#6a9c6a':'var(--text)',fontFamily:'ui-monospace,monospace'}}>{bMeta.lastAutoBackup?new Date(bMeta.lastAutoBackup).toLocaleString('zh-TW',{hour12:false}):'從未'}</span>
                </div>
                <div style={{height:1,background:'var(--border)',margin:'4px 0'}}/>
                <div onClick={()=>{exportJSON();setBMenuOpen(false);}}
                  style={{padding:'8px 10px',fontSize:12,color:'var(--text)',cursor:'pointer',borderRadius:6,display:'flex',alignItems:'center',gap:8}}
                  onMouseEnter={e=>e.currentTarget.style.background='var(--surface-hover)'}
                  onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                  📥 立即匯出 .json (有日期戳)
                </div>
                {supportsFSA()?(autoBkActive?(
                  <>
                    <div style={{padding:'8px 10px',fontSize:11,color:'#6a9c6a',display:'flex',alignItems:'center',gap:6}}>
                      <span style={{width:6,height:6,borderRadius:'50%',background:'#6a9c6a'}}/>
                      自動備份中 · 📁 {autoBkFolderName}
                    </div>
                    <div onClick={disableAutoBackup}
                      style={{padding:'8px 10px',fontSize:12,color:'var(--danger)',cursor:'pointer',borderRadius:6}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--danger-bg)'}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      ⏹ 停用自動備份
                    </div>
                  </>
                ):(
                  <div onClick={enableAutoBackup}
                    style={{padding:'8px 10px',fontSize:12,color:'var(--accent)',cursor:'pointer',borderRadius:6,display:'flex',alignItems:'center',gap:8}}
                    onMouseEnter={e=>e.currentTarget.style.background='var(--accent-soft)'}
                    onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                    📁 啟用自動備份 (選擇資料夾)
                  </div>
                )):(
                  <div style={{padding:'8px 10px',fontSize:11,color:'var(--text-3)',fontStyle:'italic'}}>
                    此瀏覽器不支援自動備份<br/>
                    <span style={{fontSize:10}}>(Chrome / Edge 才支援)</span>
                  </div>
                )}
              </div>
            )}
          </div>

          {/* User pill */}
          {(currentUser||offlineMode)&&(
            <div ref={userMenuRef} style={{position:'relative'}}>
              <div onClick={()=>setUserMenuOpen(o=>!o)} style={{display:'inline-flex',alignItems:'center',gap:6,padding:'4px 4px 4px 12px',borderRadius:999,background:'var(--surface-2)',border:'1px solid var(--border)',fontSize:11.5,color:'var(--text-2)',cursor:'pointer'}}>
                <span style={{width:6,height:6,borderRadius:'50%',background:syncDotColor,flexShrink:0}}/>
                <span style={{fontFamily:'ui-monospace,monospace',fontSize:11,maxWidth:140,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{currentUser?currentUser.email:'離線模式'}</span>
                <span style={{color:'var(--text-3)',fontSize:9,padding:'0 4px'}}>▾</span>
              </div>
              {userMenuOpen&&(
                <div style={{position:'absolute',top:'calc(100% + 6px)',right:0,background:'var(--surface-2)',border:'1px solid var(--border)',borderRadius:10,padding:6,minWidth:240,boxShadow:'0 12px 32px rgba(0,0,0,0.55)',zIndex:200}}>
                  <div style={{padding:'10px 12px',borderBottom:'1px solid var(--border)',marginBottom:4}}>
                    <div style={{fontFamily:'ui-monospace,monospace',fontSize:12,color:'var(--text)',overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{currentUser?currentUser.email:'離線模式'}</div>
                    <div style={{fontSize:11,color:'var(--text-3)',marginTop:4,display:'flex',alignItems:'center',gap:6}}>
                      <span style={{width:6,height:6,borderRadius:'50%',background:syncDotColor}}/>
                      <span>{syncStatusText}</span>
                    </div>
                    {cloudLastSavedAt&&<div style={{fontSize:10,color:'var(--text-3)',fontFamily:'ui-monospace,monospace',marginTop:4}}>上次同步:{new Date(cloudLastSavedAt).toLocaleString('zh-TW',{hour12:false})}</div>}
                  </div>
                  {currentUser?(
                    <>
                      <div onClick={()=>{saveToCloud();setUserMenuOpen(false);}}
                        style={{padding:'8px 12px',borderRadius:6,cursor:'pointer',fontSize:13,color:'var(--text)',display:'flex',alignItems:'center',gap:8}}
                        onMouseEnter={e=>e.currentTarget.style.background='var(--surface-hover)'}
                        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                        <span>🔄</span><span>立即同步</span>
                      </div>
                      <div onClick={()=>{setUserMenuOpen(false);handleLogout();}}
                        style={{padding:'8px 12px',borderRadius:6,cursor:'pointer',fontSize:13,color:'var(--danger)',display:'flex',alignItems:'center',gap:8}}
                        onMouseEnter={e=>e.currentTarget.style.background='var(--danger-bg)'}
                        onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                        <span>⏏</span><span>登出</span>
                      </div>
                    </>
                  ):(
                    <div onClick={()=>{try{localStorage.removeItem(OFFLINE_MODE_KEY);}catch(e){}setOfflineMode(false);document.getElementById('authGate').style.display='';setUserMenuOpen(false);}}
                      style={{padding:'8px 12px',borderRadius:6,cursor:'pointer',fontSize:13,color:'var(--accent)',display:'flex',alignItems:'center',gap:8}}
                      onMouseEnter={e=>e.currentTarget.style.background='var(--accent-soft)'}
                      onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
                      <span>☁</span><span>登入帳號 (啟用雲端同步)</span>
                    </div>
                  )}
                </div>
              )}
            </div>
          )}

          {/* Theme toggle */}
          <button onClick={toggleTheme} className="theme-toggle-btn" title="切換主題">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="12" cy="12" r="4"></circle>
              <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path>
            </svg>
          </button>

          <button onClick={oAP} style={B('#d4a05c','#fff')}>＋ 新增專案</button>
        </div>
      </div>

      <div style={{background:'#18181b',borderRadius:12,overflow:'hidden',border:'1px solid #2e2e33'}}>
        <div style={{overflowX:'auto'}}>
          <div style={{minWidth:lw+vDays*cw}}>
            <div style={{display:'flex',borderBottom:'1px solid #2e2e33',background:'#18181b'}}>
              <div style={{width:lw,minWidth:lw}}/>
              <div style={{position:'relative',flex:1,height:24}}>
                {months.map(m=><div key={m.l} style={{position:'absolute',left:m.s*cw,height:'100%',padding:'0 8px',fontSize:10,color:'#a1a1a6',display:'flex',alignItems:'center',fontWeight:600,borderLeft:'1px solid #2e2e33'}}>{m.l}</div>)}
              </div>
            </div>
            <div style={{display:'flex',borderBottom:'1px solid #2e2e33',background:'#18181b'}}>
              <div style={{width:lw,minWidth:lw,padding:'0 16px',fontSize:10,color:'#6e6e73',display:'flex',alignItems:'center',position:'relative'}}>
                專案 / 任務
                <div onMouseDown={sr} style={{position:'absolute',right:0,top:0,bottom:0,width:6,cursor:'col-resize',display:'flex',alignItems:'center',justifyContent:'center'}}>
                  <div style={{width:2,height:16,borderRadius:1,background:'#2e2e33'}}/>
                </div>
              </div>
              {dates.map((d,i)=>{
                const it=i===tOff,we=d.getDay()===0||d.getDay()===6;
                return<div key={i} style={{width:cw,minWidth:cw,height:28,display:'flex',alignItems:'center',paddingLeft:3,fontSize:9,color:it?'#d4a05c':we?'#6e6e73':'#6e6e73',background:it?'#6b5234':we?'rgba(255,255,255,0.04)':'transparent',fontWeight:it?700:400,borderLeft:'1px solid #2e2e3340'}}>{cw>=22?d.getDate():''}</div>;
              })}
            </div>

            {projs.map((proj,pi)=>(
              <div key={proj.id} draggable
                onDragStart={e=>pDS(e,pi)} onDragOver={e=>pDO(e,pi)} onDrop={e=>pDr(e,pi)}
                onDragEnd={()=>{setDProj(null);setDoPrj(null);}}
                onContextMenu={e=>onProjCtx(e,proj.id)}
                style={{opacity:dProj===pi?.4:1,outline:doPrj===pi&&dProj!==pi?'2px solid #d4a05c':'none',outlineOffset:'-2px'}}>
                <div style={{display:'flex',borderBottom:'1px solid #2e2e33',background:'#18181b'}}>
                  <div style={{width:lw,minWidth:lw,display:'flex',alignItems:'center',gap:5,padding:'0 8px',cursor:'pointer'}} onClick={()=>tog(proj.id)}>
                    <span style={{cursor:'grab',color:'#6e6e73',fontSize:13,flexShrink:0,userSelect:'none'}} onMouseDown={e=>e.stopPropagation()}>⠿</span>
                    <div style={{width:3,height:32,borderRadius:2,background:proj.color,flexShrink:0}}/>
                    <span style={{fontSize:12,color:'#ededee',fontWeight:700,flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>
                      <span style={{color:'#6e6e73',marginRight:4,fontSize:10}}>{proj.collapsed?'▶':'▼'}</span>{proj.name}
                    </span>
                    <button onClick={e=>{e.stopPropagation();oEP(proj);}} style={{background:'none',border:'none',color:'#6e6e73',cursor:'pointer',fontSize:12,padding:'2px 4px',flexShrink:0}}>✎</button>
                    <button onClick={e=>{e.stopPropagation();oAT(proj.id);}} style={{background:proj.color+'22',border:'1px solid '+proj.color+'55',color:proj.color,cursor:'pointer',fontSize:10,padding:'2px 7px',borderRadius:4,flexShrink:0,fontWeight:700}}>＋</button>
                  </div>
                  <div style={{flex:1,height:36,position:'relative'}}>
                    {tOff>=0&&tOff<vDays&&<div style={{position:'absolute',left:tOff*cw+cw/2,top:0,bottom:0,width:1.5,background:'#d4a05c',opacity:.5,zIndex:2}}/>}
                    {proj.tasks.length>0&&(()=>{
                      const ss=proj.tasks.map(t=>+new Date(t.start)),es=proj.tasks.map(t=>+new Date(t.end));
                      const off=db(ds(vStart),ds(new Date(Math.min(...ss)))),len=db(ds(new Date(Math.min(...ss))),ds(new Date(Math.max(...es))))+1;
                      if(off>=vDays||off+len<=0)return null;
                      return<div style={{position:'absolute',left:Math.max(0,off)*cw,top:14,height:8,width:Math.max(cw,(len-Math.max(0,-off))*cw)-4,borderRadius:4,background:proj.color,opacity:.2}}/>;
                    })()}
                  </div>
                </div>
                {!proj.collapsed&&proj.tasks.map((task,ti)=>{
                  const off=db(ds(vStart),task.start),len=db(task.start,task.end)+0.5;
                  const bL=Math.max(0,off)*cw,bW=Math.max(cw*.5,(len-Math.max(0,-off))*cw);
                  const vis=off<vDays&&off+len>0;
                  const iD=dTask&&dTask.pid===proj.id&&dTask.i===ti;
                  const iO=doTsk&&doTsk.pid===proj.id&&doTsk.i===ti&&!iD;
                  const isSel=selected.has(selKey(proj.id,task.id));
                  return(
                    <div key={task.id} draggable
                      onDragStart={e=>tDS(e,proj.id,ti)} onDragOver={e=>tDO(e,proj.id,ti)} onDrop={e=>tDr(e,proj.id,ti)}
                      onDragEnd={()=>{setDTask(null);setDoTsk(null);}}
                      style={{display:'flex',borderBottom:'1px solid #2e2e3340',background:isSel?proj.color+'18':ti%2===0?'#18181b':'#1c1c1f',opacity:iD?.4:1,outline:iO?'2px solid '+proj.color+'99':isSel?'1px solid '+proj.color+'55':'none',outlineOffset:'-1px'}}
                      onMouseEnter={e=>{if(!dTask&&!isSel)e.currentTarget.style.background='#2a2a2f';}}
                      onMouseLeave={e=>e.currentTarget.style.background=isSel?proj.color+'18':ti%2===0?'#18181b':'#1c1c1f'}>
                      <div style={{width:lw,minWidth:lw,display:'flex',alignItems:'center',gap:5,padding:'0 8px 0 16px',cursor:'pointer'}}
                        onClick={e=>{ if(e.shiftKey){toggleSel(e,proj.id,task.id);}else{oET(proj.id,task);} }}>
                        <span style={{cursor:'grab',color:'#6e6e73',fontSize:12,flexShrink:0,userSelect:'none'}}>⠿</span>
                        <div style={{width:7,height:7,borderRadius:'50%',background:proj.color,flexShrink:0,opacity:.7}}/>
                        <span style={{fontSize:12,color:isSel?'#ededee':'#a1a1a6',flex:1,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{task.name}</span>
                        <button onClick={e=>{e.stopPropagation();dT(proj.id,task.id);}} style={{background:'none',border:'none',color:'#6e6e73',cursor:'pointer',fontSize:13,padding:'2px 5px',flexShrink:0}}>×</button>
                      </div>
                      <div style={{position:'relative',flex:1,height:32}} onClick={e=>{if(e.shiftKey)toggleSel(e,proj.id,task.id);else if(e.target===e.currentTarget)setSelected(new Set());}}>

                        {tOff>=0&&tOff<vDays&&<div style={{position:'absolute',left:tOff*cw+cw/2,top:0,bottom:0,width:1.5,background:'#d4a05c',opacity:.25,zIndex:2}}/>}
                        {dates.map((d,i)=>(d.getDay()===0||d.getDay()===6)&&<div key={i} style={{position:'absolute',left:i*cw,top:0,bottom:0,width:cw,background:'rgba(255,255,255,0.03)'}}/>)}
                        {vis&&(
                          <div style={{position:'absolute',left:bL,top:3,height:26,display:'flex',alignItems:'center'}}>
                            <div style={{height:20,width:bW-4,borderRadius:5,background:isSel?proj.color+'55':proj.color+'28',border:'1.5px solid '+(isSel?proj.color:proj.color+'77'),overflow:'hidden',cursor:'grab',position:'relative',flexShrink:0,userSelect:'none'}}
                              onMouseDown={e=>onBarMouseDown(e,proj.id,task,cw)}
                              onMouseEnter={e=>e.currentTarget.style.filter='brightness(1.3)'}
                              onMouseLeave={e=>e.currentTarget.style.filter=''}>
                              <div style={{height:'100%',width:task.progress+'%',background:proj.color,opacity:.6,transition:'width .3s'}}/>
                              {bW>50&&<div style={{position:'absolute',inset:0,display:'flex',alignItems:'center',paddingLeft:6,fontSize:10,color:'#fff',fontWeight:500,pointerEvents:'none',textShadow:'0 1px 2px #0008',whiteSpace:'nowrap',overflow:'hidden'}}>{task.name}{task.progress>0?' '+task.progress+'%':''}</div>}
                            </div>
                            <div style={{fontSize:9,color:proj.color,fontWeight:700,marginLeft:4,whiteSpace:'nowrap',opacity:.9,flexShrink:0}}>{task.end.slice(5).replace('-','/')}</div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
                {!proj.collapsed&&proj.tasks.length===0&&<div style={{display:'flex'}}><div style={{width:lw,minWidth:lw}}/><div style={{flex:1,padding:'10px 0',textAlign:'center',fontSize:11,color:'#6e6e73'}}>點右方 ＋ 新增任務</div></div>}
              </div>
            ))}
            {projs.length===0&&(
              <div style={{display:'flex',flexDirection:'column',alignItems:'center',padding:'48px 0',gap:12}}>
                <div style={{fontSize:13,color:'#6e6e73'}}>還沒有專案</div>
                <div style={{fontSize:11,color:'#2e2e33'}}>點「＋ 新增專案」，或點「匯入 JSON」載入備份</div>
              </div>
            )}
          </div>
        </div>
      </div>

      <div style={{marginTop:10,display:'flex',gap:14,fontSize:10,color:'#6e6e73'}}>
        <span>▼/▶ 展開收合</span><span>✎ 編輯</span><span>⠿ 拖曳排序</span><span>右鍵複製專案</span><span>Shift+點 多選任務</span><span>拖曳 Bar 移動日期</span>
      </div>

      {ctxMenu&&(
        <>
          <div style={{position:'fixed',inset:0,zIndex:199}} onClick={()=>setCtxMenu(null)}/>
          <div style={{position:'fixed',left:ctxMenu.x,top:ctxMenu.y,zIndex:200,background:'#232327',border:'1px solid #2e2e33',borderRadius:10,padding:6,boxShadow:'0 8px 32px #000a',minWidth:160}}>
            <div onClick={()=>dupProj(ctxMenu.projId)}
              style={{padding:'8px 14px',fontSize:13,color:'#ededee',cursor:'pointer',borderRadius:6,display:'flex',alignItems:'center',gap:8}}
              onMouseEnter={e=>e.currentTarget.style.background='#2e2e33'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              ⧉ 複製此專案
            </div>
            <div onClick={()=>{const p=projs.find(x=>x.id===ctxMenu.projId);if(p){oEP(p);}setCtxMenu(null);}}
              style={{padding:'8px 14px',fontSize:13,color:'#ededee',cursor:'pointer',borderRadius:6,display:'flex',alignItems:'center',gap:8}}
              onMouseEnter={e=>e.currentTarget.style.background='#2e2e33'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              ✎ 編輯專案
            </div>
            <div style={{height:1,background:'#2e2e33',margin:'4px 0'}}/>
            <div onClick={()=>{dP(ctxMenu.projId);}}
              style={{padding:'8px 14px',fontSize:13,color:'#c87f7f',cursor:'pointer',borderRadius:6,display:'flex',alignItems:'center',gap:8}}
              onMouseEnter={e=>e.currentTarget.style.background='#2e2e33'}
              onMouseLeave={e=>e.currentTarget.style.background='transparent'}>
              × 刪除專案
            </div>
          </div>
        </>
      )}

      {modal&&(
        <div style={{position:'fixed',inset:0,background:'#000b',display:'flex',alignItems:'center',justifyContent:'center',zIndex:100}} onClick={()=>setModal(null)}>
          <div style={{background:'#232327',border:'1px solid #2e2e33',borderRadius:16,padding:28,width:360,boxShadow:'0 24px 60px #000a'}} onClick={e=>e.stopPropagation()}>
            <h2 style={{margin:'0 0 16px',fontSize:15,color:'#ededee'}}>
              {modal.type==='proj'?(modal.projId?'編輯專案':'新增專案'):(modal.taskId?'編輯任務':'新增任務')}
            </h2>
            <label style={lbl}>名稱</label>
            {modal.type==='task'?(
              <div style={{marginBottom:14}}>
                {tags.length>0&&(
                  <div style={{marginBottom:8}}>
                    <div style={{fontSize:10,color:'#6e6e73',marginBottom:6,fontWeight:600,textTransform:'uppercase',letterSpacing:'0.05em'}}>常用項目</div>
                    <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
                      {tags.filter(t=>!form.name||t.toLowerCase().includes(form.name.toLowerCase())).map(t=>(
                        <div key={t} style={{display:'flex',alignItems:'center',borderRadius:20,overflow:'hidden',border:'1px solid #2e2e33'}}>
                          <div onClick={()=>setForm(f=>({...f,name:t}))} style={{padding:'4px 10px',fontSize:12,cursor:'pointer',color:form.name===t?'#fff':'#a1a1a6',background:form.name===t?'#d4a05c':'transparent'}}>{t}</div>
                          <div onClick={()=>rmT(t)} style={{padding:'4px 7px',fontSize:11,color:'#6e6e73',cursor:'pointer'}}>×</div>
                        </div>
                      ))}
                    </div>
                  </div>
                )}
                <input style={inp} value={form.name||''} autoFocus onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder='輸入新項目名稱，或從上方選取…'/>
              </div>
            ):(
              <input style={inp} value={form.name||''} autoFocus onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder='專案名稱…'/>
            )}
            {modal.type==='proj'&&(
              <><label style={lbl}>顏色</label>
              <div style={{display:'flex',gap:8,marginBottom:16}}>
                {PC.map((c,i)=><div key={i} onClick={()=>setForm(f=>({...f,color:c}))} style={{width:26,height:26,borderRadius:'50%',background:c,cursor:'pointer',border:form.color===c?'3px solid #fff':'3px solid transparent'}}/>)}
              </div></>
            )}
            {modal.type==='task'&&(
              <><div style={{display:'flex',gap:12}}>
                <div style={{flex:1}}><label style={lbl}>開始</label><input type='date' style={inp} value={form.start||''} onChange={e=>setForm(f=>({...f,start:e.target.value}))}/></div>
                <div style={{flex:1}}><label style={lbl}>結束</label><input type='date' style={inp} value={form.end||''} onChange={e=>setForm(f=>({...f,end:e.target.value}))}/></div>
              </div>
              <label style={lbl}>完成進度：{form.progress||0}%</label>
              <input type='range' min={0} max={100} value={form.progress||0} onChange={e=>setForm(f=>({...f,progress:Number(e.target.value)}))} style={{width:'100%',marginBottom:16,accentColor:'#d4a05c'}}/></>
            )}
            <div style={{display:'flex',gap:8}}>
              <button onClick={sv} style={B('#d4a05c','#fff',true)}>{modal.projId||modal.taskId?'儲存':'新增'}</button>
              <button onClick={()=>setModal(null)} style={B('#2e2e33')}>取消</button>
              {(modal.projId||modal.taskId)&&<button onClick={()=>modal.type==='proj'?dP(modal.projId):dT(modal.projId,modal.taskId)} style={{...B('#4a2828','#c87f7f'),marginLeft:'auto'}}>刪除</button>}
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root=ReactDOM.createRoot(document.getElementById('root'));

// ============ AUTH BOOTSTRAP (outside React) ============
let authMode='signin';

function showAuthGate(){
  document.getElementById('authGate').style.display='';
}
function hideAuthGate(){
  document.getElementById('authGate').style.display='none';
}
function showAuthError(msg){
  const el=document.getElementById('authError');
  el.textContent=msg;
  el.classList.add('show');
}
function clearAuthError(){
  const el=document.getElementById('authError');
  el.classList.remove('show');
  el.textContent='';
}
function updateAuthModeUI(){
  const submitBtn=document.getElementById('authSubmit');
  const modeText=document.getElementById('authModeText');
  const modeSwitch=document.getElementById('authModeSwitch');
  if(authMode==='signin'){
    submitBtn.textContent='登入';
    modeText.textContent='還沒有帳號?';
    modeSwitch.textContent='註冊新帳號';
  } else {
    submitBtn.textContent='註冊';
    modeText.textContent='已經有帳號了?';
    modeSwitch.textContent='回到登入';
  }
}

async function handleAuthSubmit(e){
  e.preventDefault();
  clearAuthError();
  const email=document.getElementById('authEmail').value.trim();
  const password=document.getElementById('authPassword').value;
  if(!email||!password)return;
  if(password.length<6){showAuthError('密碼至少 6 個字元');return;}
  const submitBtn=document.getElementById('authSubmit');
  submitBtn.disabled=true;
  submitBtn.textContent=authMode==='signin'?'登入中…':'註冊中…';
  try{
    if(!initSupabase())throw new Error('Supabase SDK 未載入');
    let result;
    if(authMode==='signin'){
      result=await sbClient.auth.signInWithPassword({email,password});
    } else {
      result=await sbClient.auth.signUp({email,password});
    }
    if(result.error)throw result.error;
    // onAuthStateChange handler will take over
  }catch(err){
    showAuthError(err.message||'登入失敗');
    submitBtn.disabled=false;
    updateAuthModeUI();
  }
}

function setOfflineModeChoice(){
  try{localStorage.setItem(OFFLINE_MODE_KEY,'1');}catch(e){}
  if(window.__setOfflineMode)window.__setOfflineMode(true);
  hideAuthGate();
}

// Wire up auth UI
document.getElementById('authForm').addEventListener('submit',handleAuthSubmit);
document.getElementById('authModeSwitch').addEventListener('click',()=>{
  authMode=authMode==='signin'?'signup':'signin';
  clearAuthError();
  updateAuthModeUI();
});
document.getElementById('authOfflineBtn').addEventListener('click',setOfflineModeChoice);

// Migration dialog
document.getElementById('migrationUploadBtn').addEventListener('click',async()=>{
  document.getElementById('migrationDialog').style.display='none';
  // Trigger a save to push current local state to cloud
  // We need to call the App's saveToCloud — easiest way is to dispatch a "force sync" via global
  if(window.__forceSync){
    await window.__forceSync();
  }
});
document.getElementById('migrationSkipBtn').addEventListener('click',()=>{
  document.getElementById('migrationDialog').style.display='none';
  // Clear local data to start fresh from cloud (which is empty)
  try{
    localStorage.removeItem('gantt-workspaces');
    localStorage.removeItem('gantt-ws-current');
  }catch(e){}
  window.location.reload();
});

// Main bootstrap
(async function bootstrap(){
  let bootstrapDone=false;
  const watchdog=setTimeout(()=>{
    if(bootstrapDone)return;
    console.warn('Bootstrap watchdog triggered — forcing offline mode');
    bootstrapDone=true;
    if(window.__setOfflineMode)window.__setOfflineMode(true);
  },5000);
  const finish=()=>{bootstrapDone=true;clearTimeout(watchdog);};

  try{
    // Check offline mode
    try{
      if(localStorage.getItem(OFFLINE_MODE_KEY)==='1'){
        if(window.__setOfflineMode)window.__setOfflineMode(true);
        finish();
        return;
      }
    }catch(e){}

    if(!initSupabase()){
      console.warn('Supabase SDK not available, falling back to offline mode');
      if(window.__setOfflineMode)window.__setOfflineMode(true);
      finish();
      return;
    }

    // Check session
    try{
      const {data:{session}}=await sbClient.auth.getSession();
      if(session&&session.user){
        if(window.__setCurrentUser)window.__setCurrentUser(session.user);
      } else {
        showAuthGate();
        updateAuthModeUI();
      }
    }catch(e){
      console.error('Session check failed',e);
      showAuthGate();
      updateAuthModeUI();
    }
    finish();

    // Auth state change listener
    sbClient.auth.onAuthStateChange(async(event,session)=>{
      if(event==='SIGNED_IN'&&session&&session.user){
        try{localStorage.removeItem(OFFLINE_MODE_KEY);}catch(e){}
        hideAuthGate();
        if(window.__setCurrentUser)window.__setCurrentUser(session.user);
      } else if(event==='SIGNED_OUT'){
        if(window.__setCurrentUser)window.__setCurrentUser(null);
      }
    });
  }catch(err){
    console.error('Bootstrap critical error',err);
    if(window.__setOfflineMode)window.__setOfflineMode(true);
    finish();
  }
})();
</script>
