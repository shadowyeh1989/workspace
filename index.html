<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Workspace">
<meta name="theme-color" content="#0e0e10">
<link rel="icon" type="image/x-icon" href="icons/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="manifest" href="manifest.json">
<title>Shadow's Workspace</title>
<script>
  // Apply saved theme before page renders to prevent flash (shares key with ledger.html)
  (function() {
    try {
      var saved = localStorage.getItem('shadow_ledger_theme');
      if (saved === 'light' || saved === 'dark') {
        document.documentElement.setAttribute('data-theme', saved);
        return;
      }
    } catch (e) {}
    var prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
    document.documentElement.setAttribute('data-theme', prefersLight ? 'light' : 'dark');
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root, [data-theme="dark"] {
    --bg: #0e0e10;
    --surface: #18181b;
    --surface-2: #232327;
    --surface-hover: #2a2a2f;
    --border: #2e2e33;
    --text: #ededee;
    --text-2: #a1a1a6;
    --text-3: #6e6e73;
    --accent: #d4a05c;
    --accent-soft: #6b5234;
    --shadow-card: 0 12px 32px rgba(0,0,0,0.4);
    --serif: 'Iowan Old Style', 'Charter', 'Source Serif Pro', Georgia, serif;
    --sans: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
    --mono: 'SF Mono', 'JetBrains Mono', ui-monospace, monospace;
  }

  [data-theme="light"] {
    --bg: #faf8f3;
    --surface: #ffffff;
    --surface-2: #f1ede4;
    --surface-hover: #ebe6da;
    --border: #d8d2c4;
    --text: #2a2620;
    --text-2: #5e5849;
    --text-3: #8a8270;
    --accent: #a87434;
    --accent-soft: #ecdcc4;
    --shadow-card: 0 8px 24px rgba(80,60,30,0.12);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    transition: background-color 0.2s ease, color 0.2s ease;
  }

  .page {
    max-width: 920px;
    margin: 0 auto;
    padding: 80px 28px 40px;
    flex: 1;
    width: 100%;
  }

  .brand {
    text-align: center;
    margin-bottom: 72px;
  }
  .brand h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 44px;
    letter-spacing: -0.01em;
    line-height: 1.15;
    margin-bottom: 8px;
  }
  .brand h1 em {
    color: var(--accent);
    font-style: italic;
  }
  .brand .sub {
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.3em;
    text-transform: uppercase;
  }

  .section-label {
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 20px;
    padding-left: 4px;
  }

  .tools-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
    gap: 18px;
    margin-bottom: 60px;
  }

  .tool-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 24px;
    text-decoration: none;
    color: var(--text);
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    position: relative;
    min-height: 160px;
  }
  .tool-card:hover {
    border-color: var(--accent);
    transform: translateY(-2px);
    box-shadow: var(--shadow-card);
  }
  .tool-card.disabled {
    cursor: not-allowed;
    opacity: 0.5;
  }
  .tool-card.disabled:hover {
    border-color: var(--border);
    transform: none;
    box-shadow: none;
  }
  .tool-card .label {
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }
  .tool-card .name {
    font-family: var(--serif);
    font-size: 22px;
    font-weight: 400;
    line-height: 1.3;
    margin-bottom: 4px;
  }
  .tool-card .name em {
    color: var(--accent);
    font-style: italic;
  }
  .tool-card .desc {
    font-size: 12.5px;
    color: var(--text-2);
    line-height: 1.6;
    flex: 1;
  }
  .tool-card .arrow {
    position: absolute;
    bottom: 22px;
    right: 22px;
    color: var(--accent);
    font-size: 16px;
    opacity: 0;
    transform: translateX(-6px);
    transition: all 0.2s ease;
  }
  .tool-card:hover .arrow {
    opacity: 1;
    transform: translateX(0);
  }
  .tool-card .pending {
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-top: 6px;
  }

  footer {
    text-align: center;
    padding: 24px;
    font-size: 11px;
    color: var(--text-3);
    border-top: 1px solid var(--border);
    margin-top: auto;
  }
  footer .mono {
    font-family: var(--mono);
    font-size: 10px;
  }

  /* Theme toggle (top-right corner) */
  .theme-toggle {
    position: fixed;
    top: 20px;
    right: 20px;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-2);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s ease;
    z-index: 100;
  }
  .theme-toggle:hover {
    color: var(--accent);
    border-color: var(--accent);
  }
  .theme-toggle svg {
    width: 18px;
    height: 18px;
  }
  /* Show moon in light mode, sun in dark mode */
  .theme-toggle .icon-moon { display: none; }
  .theme-toggle .icon-sun { display: block; }
  [data-theme="light"] .theme-toggle .icon-moon { display: block; }
  [data-theme="light"] .theme-toggle .icon-sun { display: none; }

  @media (max-width: 640px) {
    .page { padding: 40px 18px 32px; }
    .brand { margin-bottom: 48px; }
    .brand h1 { font-size: 32px; }
    .tools-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }
    .tool-card {
      min-height: auto;
      padding: 20px;
    }
    .tool-card .name { font-size: 19px; }
  }
</style>
</head>
<body>
<button class="theme-toggle" id="themeToggle" title="切換主題" aria-label="切換主題">
  <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"></path></svg>
  <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
</button>

<div class="page">
  <div class="brand">
    <h1>Shadow's <em>Workspace</em></h1>
    <div class="sub">Tools · Records · Workflow</div>
  </div>

  <div class="section-label">Active Tools</div>
  <div class="tools-grid">
    <a href="ledger.html" class="tool-card">
      <div class="label">Finance</div>
      <div class="name">客戶接案<em>管理表</em></div>
      <div class="desc">月份/年度收支、工時、扣繳稅務、客戶總覽。雲端同步,跨裝置共用。</div>
      <div class="arrow">→</div>
    </a>

    <div class="tool-card disabled">
      <div class="label">Production</div>
      <div class="name">多專案<em>甘特圖</em></div>
      <div class="desc">時間軸排程、任務管理、依賴關係。</div>
      <div class="pending">即將推出 · Coming Soon</div>
    </div>

    <div class="tool-card disabled">
      <div class="label">Archive</div>
      <div class="name">硬碟<em>紀錄</em></div>
      <div class="desc">硬碟內容索引、檔案存放位置追蹤。</div>
      <div class="pending">規劃中 · Planned</div>
    </div>
  </div>
</div>

<footer>
  Shadow's Workspace · Built with <span style="color:var(--accent)">♥</span> &amp; Claude
  <br>
  <span class="mono" id="version">v1.0</span>
</footer>
<script>
  // Theme toggle (uses same localStorage key as ledger.html, so they sync)
  (function() {
    var btn = document.getElementById('themeToggle');
    var root = document.documentElement;
    btn.addEventListener('click', function() {
      var current = root.getAttribute('data-theme') || 'dark';
      var next = current === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', next);
      try { localStorage.setItem('shadow_ledger_theme', next); } catch (e) {}
      // Update meta theme-color so iOS status bar matches
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', next === 'light' ? '#faf8f3' : '#0e0e10');
    });
  })();
</script>
</body>
</html>
